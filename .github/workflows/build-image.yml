name: Build and Push Container Image
# Builds the Argus application image and publishes it to GHCR as ghcr.io/<owner>/argus.
# On main (or workflow_dispatch), also packages and pushes the Helm chart so the
# chart default image.repository/tag matches a real, pullable image.

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'configs/**'
      - 'deployments/helm/**'
      - '.github/workflows/build-image.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'configs/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Stable chart version to publish (leave empty to use Chart.yaml version)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: argus
  CHART_NAME: argus
  CHART_DIR: deployments/helm/argus

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=argus
            org.opencontainers.image.description=Centralized tamper-evident audit logging service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "## Application Image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Tags: \`${{ github.sha }}\`${{ github.ref == 'refs/heads/main' && ', `latest`' || '' }}"
            echo "- Pushed: \`${{ github.event_name != 'pull_request' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-chart:
    name: Publish Helm Chart
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Decide whether to publish a stable chart
        id: should
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only HEAD~1 HEAD > /tmp/changed 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(deployments/helm/|\.github/workflows/build-image\.yml)' /tmp/changed; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Helm
        if: steps.should.outputs.publish == 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Convert repository owner to lowercase
        if: steps.should.outputs.publish == 'true'
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (Helm)
        if: steps.should.outputs.publish == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package and push chart
        if: steps.should.outputs.publish == 'true'
        id: package
        run: |
          CHART_VER="${{ github.event.inputs.chart_version }}"
          if [ -z "$CHART_VER" ]; then
            CHART_VER="$(awk '/^version:/{print $2; exit}' ${{ env.CHART_DIR }}/Chart.yaml)"
          fi
          echo "version=${CHART_VER}" >> "$GITHUB_OUTPUT"

          helm lint ${{ env.CHART_DIR }} -f deployments/helm/values-example.yaml
          helm package ${{ env.CHART_DIR }} \
            --version "${CHART_VER}" \
            --destination .
          helm push ${{ env.CHART_NAME }}-${CHART_VER}.tgz \
            oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts

      - name: Summary
        if: steps.should.outputs.publish == 'true'
        run: |
          {
            echo "## Helm Chart Published"
            echo ""
            echo "- Chart: \`oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts/${{ env.CHART_NAME }}\`"
            echo "- Version: \`${{ steps.package.outputs.version }}\`"
            echo "- Default image: \`${{ needs.build-and-push.outputs.image }}:latest\`"
            echo "- Pull command:"
            echo "  \`helm pull oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts/${{ env.CHART_NAME }} --version ${{ steps.package.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
