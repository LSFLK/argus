name: Helm Chart CI
# Validates the Helm chart on PRs: lint + render. Never publishes — packaging and
# pushing to GHCR is handled by build-dev-chart.yml (dev charts) and
# build-image.yml (application image + stable chart).

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'deployments/helm/**'
      - '.github/workflows/helm-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-validate:
    name: Lint & template chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint chart
        run: helm lint deployments/helm/argus -f deployments/helm/values-example.yaml

      - name: Render templates (default values + explicit test password)
        run: helm template argus deployments/helm/argus --set auth.password=ci-test-password

      - name: Render templates (example values)
        run: helm template argus deployments/helm/argus -f deployments/helm/values-example.yaml
