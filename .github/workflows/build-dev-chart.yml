name: Build and Push Development Helm Chart
# Publishes a Helm chart to GHCR when the chart itself changes or on workflow_dispatch.

on:
  push:
    branches: [ main ]
    paths:
      - 'deployments/helm/**'
      - '.github/workflows/build-dev-chart.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version to publish (leave empty for 0.0.0-dev.<run_number>)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CHART_NAME: argus
  CHART_DIR: deployments/helm/argus
  VALUES_EXAMPLE: deployments/helm/values-example.yaml

jobs:
  publish-dev-chart:
    name: Package & Push Dev Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }} -f ${{ env.VALUES_EXAMPLE }}

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Determine version and package chart
        id: package
        run: |
          CHART_VER="${{ github.event.inputs.version }}"
          if [ -z "$CHART_VER" ]; then
            CHART_VER="0.0.0-dev.${{ github.run_number }}"
          fi
          echo "version=${CHART_VER}" >> "$GITHUB_OUTPUT"

          helm package ${{ env.CHART_DIR }} \
            --version "${CHART_VER}" \
            --destination .

      - name: Push chart to GHCR
        run: |
          helm push ${{ env.CHART_NAME }}-${{ steps.package.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts

      - name: Summary
        run: |
          {
            echo "## Helm Chart Published"
            echo ""
            echo "- Chart: \`oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts/${{ env.CHART_NAME }}\`"
            echo "- Version: ${{ steps.package.outputs.version }}"
            echo "- Pull command:"
            echo "  \`helm pull oci://${{ env.REGISTRY }}/${{ steps.repo_owner.outputs.owner }}/charts/${{ env.CHART_NAME }} --version ${{ steps.package.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
