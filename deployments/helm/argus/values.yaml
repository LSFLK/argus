# Default values for argus.

replicaCount: 2

image:
  repository: ghcr.io/lsflk/argus
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001
  # The ClusterIP service name exposed inside Openshift
  name: argus-service

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

securityContext:
  runAsUser: 10001
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

env:
  ENVIRONMENT: production
  DB_TYPE: postgres
  DB_HOST: audit-db
  DB_PORT: 5432
  DB_NAME: audit_db
  DB_SSLMODE: disable
  REQUIRE_SIGNATURES: "true"
  AUDIT_ENUMS_CONFIG: "/app/configs/enums.yaml"

  # AWS S3 Compliance Settings (Object Lock)
  S3_COMPLIANCE_BUCKET: "audit-compliance-logs-staging"
  S3_REGION: "us-east-1"
  S3_PREFIX: "audit-logs"
  S3_RETENTION_DAYS: "2555"
  S3_OBJECT_LOCK_MODE: "COMPLIANCE"
  S3_USE_PATH_STYLE: "false"
  S3_ENDPOINT: "" # Set to custom local endpoint if testing with MinIO or LocalStack

auth:
  username: "postgres"
  # Set plain password here if externalSecrets are disabled and existingSecret is empty
  password: ""
  existingSecret: ""

  # --- External Secrets Operator (ESO) ---
  # Enables Vault integration for injecting secrets securely
  externalSecrets:
    enabled: false
    secretStoreName: "vault-backend"
    secretStoreKind: "ClusterSecretStore"
    refreshInterval: "1h"
    # Vault key containing DB credentials
    remoteDbKey: "argus/staging/db"
    # Vault key containing AWS S3 access/secret keys
    remoteAwsKey: "argus/staging/aws"
