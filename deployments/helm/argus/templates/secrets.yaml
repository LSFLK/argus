{{- if and (not .Values.auth.existingSecret) (not .Values.auth.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus.fullname" . }}-credentials
  labels:
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "A database password is required (.Values.auth.password)" .Values.auth.password | quote }}
  ARGUS_AUTH_TOKEN: {{ .Values.auth.token | default "" | quote }}
  # Optional plain-text credentials for S3 development/testing
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
{{- end }}
